<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12051f">
  <title>Ciudad bajo el tornado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
    html, body { margin:0; width:100%; height:100%; min-height:100dvh; overflow:hidden; background:#9eabb0; }
    body, canvas { touch-action:none; }
    canvas { display:block; width:100%; height:100%; }
    #info { position:fixed; z-index:1; top:max(12px,env(safe-area-inset-top)); left:50%; width:min(92vw,760px); transform:translateX(-50%); color:#fff; font:600 clamp(11px,2vw,14px)/1.4 system-ui,sans-serif; text-align:center; letter-spacing:.04em; text-shadow:0 2px 5px #202527; pointer-events:none; }
    #info small { font-weight:400; opacity:.88; letter-spacing:normal; }
    #tornado-intensity { display:none !important; }
    #tornado-control-panel { display:none; position:fixed; z-index:6; right:62px; bottom:calc(14px + var(--safe-bottom)); width:190px; padding:12px; border:1px solid rgba(255,255,255,.18); border-radius:15px; background:rgba(9,13,16,.78); color:#fff; box-shadow:0 12px 34px rgba(0,0,0,.32); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); font:11px/1.3 system-ui,sans-serif; }
    #tornado-control-panel.is-open { display:block !important; }
    .tornado-control-head { display:flex; justify-content:space-between; align-items:center; font-weight:800; letter-spacing:.08em; }
    #tornado-strength-value { color:#f2c45f; font-size:15px; }
    #tornado-strength { width:100%; margin-top:7px; accent-color:#f2c45f; min-height:26px; }
    .tornado-control-caption { margin-top:3px; color:rgba(255,255,255,.55); font-size:9px; }
    #tornado-control-toggle { position:fixed; z-index:7; right:12px; bottom:calc(14px + var(--safe-bottom)); width:40px; height:40px; padding:0; border:1px solid rgba(255,255,255,.22); border-radius:50%; color:#fff; background:rgba(9,13,16,.68); box-shadow:0 8px 22px rgba(0,0,0,.28); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); font-size:18px; line-height:1; touch-action:manipulation; }
    #tornado-control-toggle:active { transform:scale(.94); }
    #disaster-controls { display:none !important; }
    #mobile-hint { position:fixed; z-index:2; left:50%; bottom:calc(14px + var(--safe-bottom)); transform:translateX(-50%); padding:7px 11px; border:1px solid rgba(255,255,255,.16); border-radius:999px; background:rgba(8,12,14,.42); color:rgba(255,255,255,.78); font:10px/1 system-ui,sans-serif; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); pointer-events:none; white-space:nowrap; }
    #sound-toggle { position:fixed; z-index:5; left:12px; bottom:calc(14px + var(--safe-bottom)); width:40px; height:40px; padding:0; border:1px solid rgba(255,255,255,.2); border-radius:50%; color:#fff; background:rgba(9,13,16,.62); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); font-size:16px; line-height:1; touch-action:manipulation; }
    #dialogue { position:fixed; z-index:3; left:50%; bottom:calc(58px + var(--safe-bottom)); transform:translate(-50%,8px); width:min(330px,calc(100vw - 32px)); padding:10px 13px; border-left:3px solid #f2c45f; border-radius:8px; color:#fff; background:rgba(12,18,20,.72); font:600 13px/1.35 system-ui,sans-serif; opacity:0; transition:opacity .25s,transform .25s; pointer-events:none; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
    #dialogue.visible { opacity:1; transform:translate(-50%,0); }
    @media (max-width:576px) { #info { top:max(8px,env(safe-area-inset-top)); width:94vw; } #info small b { display:none; } #tornado-control-panel { right:60px; bottom:calc(12px + var(--safe-bottom)); width:175px; } #tornado-control-toggle { right:10px; bottom:calc(12px + var(--safe-bottom)); } #sound-toggle { left:10px; bottom:calc(12px + var(--safe-bottom)); } #mobile-hint { bottom:calc(12px + var(--safe-bottom)); } }
    @media (max-height:520px) and (orientation:landscape) { #info { display:none; } #mobile-hint { display:none; } }
  </style>
</head>
<body>
  <div id="info">TORNADO Y CRECIDA URBANA<br><small>Arrastra para orbitar · Pellizca para acercar · <b>Clic derecho/Dos dedos para moverte al aeropuerto</b></small></div>
  <div id="tornado-intensity" aria-label="Control de intensidad del tornado"><label for="magnitude"><span>TORNADO</span><output id="magnitude-value">6</output></label><input id="magnitude" type="range" min="1" max="10" step="0.1" value="6" aria-label="Intensidad del tornado"></div>
  <div id="mobile-hint">Arrastra · Pellizca · Explora</div>
  <div id="dialogue"></div>
  <div id="disaster-controls" aria-hidden="true"><div id="event-status">Toca el mapa para crear un terremoto</div><button id="tsunami-trigger" type="button">Generar tsunami</button></div>
  <button id="sound-toggle" type="button" aria-label="Activar sonido" title="Activar sonido">🔇</button>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="mobile-fixes.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="environment-polish.js"></script>
  <script src="main.js"></script>
  <script src="soundscape.js"></script>
  <script src="vortex-effects.js"></script>
  <script src="pedestrian-vortex.js"></script>
</body>
</html>
