<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#260742">
  <title>Ciudad bajo el tornado</title>

  <!-- Bootstrap 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <style>
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #9eabb0;
    }

    body {
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #info {
      position: fixed;
      z-index: 1;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      width: min(92vw, 760px);
      transform: translateX(-50%);
      color: #fff;
      font: 600 clamp(11px, 2vw, 14px)/1.4 system-ui, sans-serif;
      text-align: center;
      letter-spacing: .04em;
      text-shadow: 0 2px 5px #202527;
      pointer-events: none;
    }

    #info small {
      font-weight: 400;
      opacity: .88;
      letter-spacing: normal;
    }

    #disaster-controls {
      position: fixed;
      z-index: 2;
      right: 18px;
      bottom: calc(18px + var(--safe-bottom));
      width: min(220px, calc(100vw - 36px));
      padding: 13px 15px;
      border: 1px solid rgba(230,242,245,.38);
      border-radius: 10px;
      background: rgba(14,23,27,.72);
      color: #f4f7f5;
      font: 13px/1.4 system-ui, sans-serif;
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #disaster-controls label {
      display: flex;
      justify-content: space-between;
      font-weight: 650;
    }

    #disaster-controls input {
      width: 100%;
      margin: 8px 0 7px;
      accent-color: #e0ad51;
      min-height: 24px;
    }

    #event-status {
      color: #cdd9d7;
      font-size: 12px;
    }

    #dialogue {
      position: fixed;
      z-index: 3;
      left: 22px;
      bottom: calc(22px + var(--safe-bottom));
      width: min(330px, calc(100vw - 44px));
      padding: 12px 16px;
      border-left: 3px solid #f2c45f;
      border-radius: 5px;
      color: #fff;
      background: rgba(12,18,20,.78);
      font: 600 15px/1.35 system-ui, sans-serif;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .25s, transform .25s;
      pointer-events: none;
    }

    #dialogue.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #sound-toggle {
      width: 100%;
      margin: 10px 0 0;
      padding: 8px 9px;
      border: 1px solid rgba(240,247,245,.45);
      border-radius: 6px;
      color: #f8fbfa;
      background: rgba(71,105,111,.6);
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    #tsunami-trigger {
      width: 100%;
      margin-top: 8px;
      touch-action: manipulation;
    }

    @media (max-width: 576px) {
      #info {
        top: max(8px, env(safe-area-inset-top));
        width: 94vw;
      }

      #info small b {
        display: none;
      }

      #disaster-controls {
        left: 12px;
        right: 12px;
        bottom: calc(12px + var(--safe-bottom));
        width: auto;
        padding: 11px 12px;
        font-size: 12px;
      }

      #disaster-controls input {
        margin: 6px 0;
      }

      #dialogue {
        left: 12px;
        bottom: calc(158px + var(--safe-bottom));
        width: calc(100vw - 24px);
        max-width: none;
        padding: 10px 13px;
        font-size: 13px;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      #disaster-controls {
        width: 210px;
        right: 10px;
        bottom: calc(10px + var(--safe-bottom));
      }

      #dialogue {
        left: 10px;
        bottom: calc(10px + var(--safe-bottom));
        width: min(280px, 42vw);
      }

      #info {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="info">
    TORNADO Y CRECIDA URBANA<br>
    <small>Arrastra para orbitar · Pellizca para acercar · <b>Clic derecho/Dos dedos para moverte al aeropuerto</b></small>
  </div>

  <div id="dialogue"></div>

  <div id="disaster-controls" class="shadow-lg">
    <label for="magnitude">
      <span>Intensidad del desastre</span>
      <output id="magnitude-value">6</output>
    </label>
    <input id="magnitude" type="range" min="1" max="10" step="0.1" value="6" aria-label="Intensidad del desastre">
    <div id="event-status">Toca el mapa para crear un terremoto</div>
    <button id="tsunami-trigger" type="button" class="btn btn-warning btn-sm">🌊 Generar tsunami</button>
    <button id="sound-toggle" type="button" class="btn btn-secondary btn-sm">🔇 Activar sonido</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwxHj09JcYn3nv7wiPVlz7YYJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="main.js"></script>
</body>
</html>
